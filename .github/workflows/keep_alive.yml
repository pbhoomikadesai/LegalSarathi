name: Keep Hugging Face Space & Supabase Alive

on:
  schedule:
    - cron: '0 */12 * * *' # Runs every 12 hours (at 00:00 and 12:00 UTC)
  workflow_dispatch: # Allows you to trigger it manually from GitHub Actions tab

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Hugging Face Space
        run: |
          TARGET_URL="${{ secrets.HF_SPACE_URL }}"
          if [ -z "$TARGET_URL" ]; then
            TARGET_URL="https://bhoomika-03-legal-sarathi-backend.hf.space/"
          fi
          echo "Pinging Hugging Face Space at $TARGET_URL to keep it awake..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TARGET_URL")
          echo "Received status code: $STATUS_CODE"

      - name: Ping Supabase REST API (Prevents Auto-Pausing)
        run: |
          # Use secrets if available, otherwise fallback to the configured URL & Anon Key
          SUPABASE_URL="${{ secrets.SUPABASE_URL }}"
          SUPABASE_ANON_KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          
          if [ -z "$SUPABASE_URL" ]; then
            SUPABASE_URL="https://foykzvyrehstrdgbzhnj.supabase.co"
          fi
          
          if [ -z "$SUPABASE_ANON_KEY" ]; then
            SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImZveWt6dnlyZWhzdHJkZ2J6aG5qIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxMzA1MzMsImV4cCI6MjA5NTcwNjUzM30.-ACrOvVr_JhYHBgVzvZjzXWwq_clNBfVzG45LQYv4Mk"
          fi
          
          echo "Sending query to Supabase REST API at $SUPABASE_URL..."
          
          # Requesting the REST API root with the apikey header triggers database activity
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")
            
          echo "Supabase responded with status code: $STATUS_CODE"
